# TenaCare, the Endod organisation (employer) portal at
# organisation.endod-health.com: its own Postgres, the API and the web app.
#
# The web app joins the shared nginx edge network as "endod-organisation";
# nginx terminates TLS for organisation.endod-health.com, sets
# X-Endod-Client-IP and X-Endod-Edge-Key (EDGE_SHARED_SECRET), and proxies to
# http://endod-organisation:3000; the web app refuses requests without that
# key. The API is
# reachable on this project's own network (only with the BFF secret) and on
# the external endod-bus network as "endod-organisation-api", where Endod's
# super admin calls its /platform routes (company applications) with
# X-Platform-Key = ORG_PLATFORM_KEY (docs/company-onboarding.md). Every other
# route still needs the BFF secret, so nothing else on endod-bus can use them.
#
# The integration API for companies' own systems (docs/integrations.md) is
# the same API under /integrations/v1: it also joins the shared edge network,
# as "endod-organisation-integrations", and nginx publishes only that prefix
# at api.endod-health.com/organisation/v1/ (README.md, "Integration API").
# Its access tokens are signed with the key in INTEGRATIONS_SIGNING_KEY_FILE
# (mounted read-only into the API and the worker). The worker sends the
# webhook events and forgets old request logs.
#   docker network create endod-bus   # once per host, if it does not exist yet
#
#   cd deploy && cp .env.example .env   # then fill it in
#   docker compose --env-file .env up -d --build
#   docker compose exec api python -m app.cli create-org --name "Example PLC" --tin 0012345678
#   docker compose exec api python -m app.cli create-admin --org <id> --email hr@example.et --name "Full Name"
#
# Database roles (deploy/postgres-init/10-roles.sh, run when the volume is
# first created): the one-shot `migrate` service runs Alembic as org_owner;
# the API connects as org_app, which cannot change the schema and can only
# read and append to the audit log.

name: endod-organisation

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: organisation
      # The superuser: only for the init script and emergencies; no app uses it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      ORG_OWNER_PASSWORD: ${ORG_OWNER_PASSWORD:?set ORG_OWNER_PASSWORD in deploy/.env}
      ORG_APP_PASSWORD: ${ORG_APP_PASSWORD:?set ORG_APP_PASSWORD in deploy/.env}
    volumes:
      - organisation_pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [default]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d organisation"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Applies the Alembic migrations as the owner role, then exits. `up` runs it
  # again each time; the API starts only after it succeeded.
  migrate:
    build: ../backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      ORG_ENVIRONMENT: production
      ORG_DATABASE_URL: ${ORG_MIGRATE_DATABASE_URL:?set ORG_MIGRATE_DATABASE_URL (the org_owner role) in deploy/.env}
      ORG_APP_ROLE: org_app
    networks: [default]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      ORG_ENVIRONMENT: production
      # The org_app role (not the owner, not the superuser).
      ORG_DATABASE_URL: ${ORG_DATABASE_URL:?set ORG_DATABASE_URL (the org_app role) in deploy/.env}
      ORG_RECEIPTS_DIR: /data/receipts
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (at least 32 random characters)}
      SITE_ORIGIN: ${SITE_ORIGIN:-https://organisation.endod-health.com}
      # Only the web app knows it: anything else reaching this API is refused,
      # and only the web app names the visitor.
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?set BFF_SHARED_SECRET (at least 32 random characters)}
      # Endod's super admin sends it as X-Platform-Key to /platform/* over
      # endod-bus (its ORGANISATION_PLATFORM_KEY). Empty: the platform API answers 503.
      ORG_PLATFORM_KEY: ${ORG_PLATFORM_KEY:-}
      # The integration API (docs/integrations.md): the key that signs its
      # access tokens (mounted below), where nginx publishes it, and nginx's
      # key (X-Endod-Edge-Key, the same as the web app's): without it the
      # integration API answers 503, so nothing else on the edge network can
      # call it and choose X-Endod-Client-IP.
      INTEGRATIONS_SIGNING_KEY_FILE: /run/secrets/integrations-signing.pem
      INTEGRATIONS_PUBLIC_URL: ${INTEGRATIONS_PUBLIC_URL:-https://api.endod-health.com/organisation/v1}
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:?set EDGE_SHARED_SECRET (at least 32 random characters)}
    volumes:
      # Receipt photos and scans, and companies' application documents, under
      # ids: <organisation id>/<file id>.
      - organisation_receipts:/data/receipts
      # The integration API's token signing key (README.md, "Integration
      # API"): read-only, never created if missing.
      - type: bind
        source: ${INTEGRATIONS_SIGNING_KEY_FILE:-/opt/endod-organisation/deploy/keys/integrations-signing.pem}
        target: /run/secrets/integrations-signing.pem
        read_only: true
        bind:
          create_host_path: false
    networks:
      # Its own network first: Postgres and the web app.
      default: {}
      endod_bus:
        aliases: [endod-organisation-api]
      # nginx publishes the integration API from here, and only its prefix
      # (location /organisation/v1/ -> /integrations/v1/; README.md).
      shared_edge:
        aliases: [endod-organisation-integrations]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Sends the integration API's webhook events (with retries for 24 hours,
  # public https addresses only) and forgets request logs after 30 days.
  worker:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      ORG_ENVIRONMENT: production
      ORG_DATABASE_URL: ${ORG_DATABASE_URL:?set ORG_DATABASE_URL (the org_app role) in deploy/.env}
      # Opens the sealed webhook secrets and event bodies.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (at least 32 random characters)}
      INTEGRATIONS_SIGNING_KEY_FILE: /run/secrets/integrations-signing.pem
      INTEGRATIONS_PUBLIC_URL: ${INTEGRATIONS_PUBLIC_URL:-https://api.endod-health.com/organisation/v1}
    volumes:
      - type: bind
        source: ${INTEGRATIONS_SIGNING_KEY_FILE:-/opt/endod-organisation/deploy/keys/integrations-signing.pem}
        target: /run/secrets/integrations-signing.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      disable: true
    # Its own network only: Postgres, and the internet for webhooks.
    networks: [default]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ../organisation-frontend
    restart: unless-stopped
    environment:
      ORG_API_URL: http://api:8000
      SITE_ORIGIN: ${SITE_ORIGIN:-https://organisation.endod-health.com}
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?set BFF_SHARED_SECRET (at least 32 random characters)}
      # nginx sends it as X-Endod-Edge-Key on every request; anything else on
      # the shared edge network that calls this container directly is refused.
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:?set EDGE_SHARED_SECRET (at least 32 random characters)}
    networks:
      default: {}
      shared_edge:
        aliases: [endod-organisation]
    depends_on:
      api:
        condition: service_healthy

volumes:
  organisation_pgdata:
  organisation_receipts:

networks:
  default: {}
  shared_edge:
    external: true
    name: ${SHARED_NGINX_NETWORK:-eyita_edge}
  endod_bus:
    external: true
    name: endod-bus
