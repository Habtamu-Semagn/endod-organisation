name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Organisation API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: organisation
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: organisation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U organisation" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Database roles (deploy/postgres-init; the platform role script twice, as it is idempotent)
        env:
          PGHOST: localhost
          PGPASSWORD: ci-only
          POSTGRES_USER: organisation
          POSTGRES_DB: organisation_roles
          ORG_OWNER_PASSWORD: owner-ci
          ORG_APP_PASSWORD: app-ci
        run: |
          psql -U organisation -d organisation -v ON_ERROR_STOP=1 -c "CREATE DATABASE organisation_roles"
          sh ../deploy/postgres-init/10-roles.sh
          sh ../deploy/postgres-init/20-platform-role.sh
          sh ../deploy/postgres-init/20-platform-role.sh
      - name: Migrations apply on PostgreSQL and match the models
        env:
          ORG_DATABASE_URL: postgresql+psycopg://organisation:ci-only@localhost:5432/organisation
          ORG_RECEIPTS_DIR: /tmp/receipts
        run: |
          python -c "from app import models; from app.db import Base, get_engine; Base.metadata.drop_all(get_engine())"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          ORG_ID=$(python -m app.cli create-org --name "CI Organisation" --tin 0012345678 | tail -n 1)
          printf '%s\n' 'a long ci passphrase' | python -m app.cli create-admin --org "$ORG_ID" --email ci@tena.example --name "CI Admin" --password-stdin
          python -m app.cli create-admin --org "$ORG_ID" --email link@tena.example --name "Link Admin" | grep -q '/setup#'
          python -m app.cli list-orgs
          python -m app.cli list-admins
      - name: Row-level security on an existing database (0003 with data, then head, down and up)
        env:
          PGHOST: localhost
          OWNER_URL: postgresql+psycopg://org_owner:owner-ci@localhost:5432/organisation_roles
        run: |
          # As production is today: at 0003, with two suspended organisations and an admin.
          ORG_DATABASE_URL=$OWNER_URL alembic upgrade 0003
          PGPASSWORD=owner-ci psql -U org_owner -d organisation_roles -v ON_ERROR_STOP=1 -c "
            INSERT INTO organisations (id, name, tin, status, payout_methods, next_claim_number, next_batch_number, created_at)
            VALUES ('c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1', 'Test One', '0000000101', 'suspended', 'cbe', 1, 1, now()),
                   ('c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2', 'Test Two', '0000000102', 'suspended', 'cbe', 1, 1, now());
            INSERT INTO org_admins (id, organisation_id, email, name, active, failed_attempts, code_failures, created_at)
            VALUES ('a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1', 'c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1', 'one@test.example', 'One', true, 0, 0, now());
            INSERT INTO employees (id, organisation_id, employee_number, name, phone, department, active, created_at, updated_at)
            VALUES ('e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1', 'c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1', 'E1', 'Employee', '+251911000001', 'Ops', true, now(), now());"
          ORG_DATABASE_URL=$OWNER_URL alembic upgrade head
          as_app() { PGPASSWORD=app-ci psql -U org_app -d organisation_roles -v ON_ERROR_STOP=1 -tAc "$1"; }
          # No tenant: nothing. A setting opens nothing; the platform role: both. One organisation: its own admin only.
          test "$(as_app 'SELECT count(*) FROM organisations')" = 0
          test "$(PGOPTIONS='-c app.scope=platform' as_app 'SELECT count(*) FROM organisations')" = 0
          test "$(PGOPTIONS='-c role=org_platform' as_app 'SELECT count(*) FROM organisations')" = 2
          test "$(PGOPTIONS='-c app.organisation_id=c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1c1' as_app 'SELECT count(*) FROM org_admins')" = 1
          test "$(PGOPTIONS='-c app.organisation_id=c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2' as_app 'SELECT count(*) FROM org_admins')" = 0
          # A reference across organisations is refused even to the platform role (0005).
          if PGOPTIONS='-c role=org_platform' as_app "INSERT INTO dependants (id, organisation_id, employee_id, name, relationship, active, created_at) VALUES ('d2d2d2d2d2d2d2d2d2d2d2d2d2d2d2d2', 'c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2c2', 'e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1e1', 'Cross', 'child', true, now())"; then exit 1; fi
          # Down (row-level security off, the data intact) and up again.
          ORG_DATABASE_URL=$OWNER_URL alembic downgrade 0003
          test "$(as_app 'SELECT count(*) FROM organisations')" = 2
          test "$(as_app "SELECT count(*) FROM pg_class WHERE relrowsecurity OR relforcerowsecurity")" = 0
          ORG_DATABASE_URL=$OWNER_URL alembic upgrade head
          ORG_DATABASE_URL=$OWNER_URL alembic check
      - name: Tests (PostgreSQL, as the app role under row-level security)
        env:
          ORG_TEST_DATABASE_URL: postgresql+psycopg://org_app:app-ci@localhost:5432/organisation_roles
          ORG_TEST_OWNER_DATABASE_URL: postgresql+psycopg://org_owner:owner-ci@localhost:5432/organisation_roles
          ORG_ROLES_APP_URL: postgresql+psycopg://org_app:app-ci@localhost:5432/organisation_roles
        run: python -m pytest -q
      - name: Tables made by a later migration reach the app role too (default privileges)
        env:
          PGHOST: localhost
        run: |
          PGPASSWORD=owner-ci psql -U org_owner -d organisation_roles -v ON_ERROR_STOP=1 -c "CREATE TABLE later_table (id int)"
          PGPASSWORD=app-ci psql -U org_app -d organisation_roles -v ON_ERROR_STOP=1 -c "INSERT INTO later_table VALUES (1)"

  web:
    name: Web app (lint, types, build, browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: organisation-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: organisation-frontend/package-lock.json
      - run: npm ci
      # The browser tests run against the real organisation API.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install the organisation API
        run: pip install -r ../backend/requirements.txt
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npx next build
      # After the build: it generates the route types the type check needs.
      - name: Type check
        run: npx tsc --noEmit
      # playwright.config.ts drives the `chrome` channel: the runner's installed
      # Google Chrome, so no browser is downloaded.
      - name: Browser tests
        env:
          E2E_PYTHON: python
        run: npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            organisation-frontend/playwright-report
            organisation-frontend/test-results
          retention-days: 7

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t endod-organisation-api backend
      - run: docker build -t endod-organisation-web organisation-frontend
      - name: Compose file is valid
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/^SESSION_SECRET=$/SESSION_SECRET=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci/; s/^BFF_SHARED_SECRET=$/BFF_SHARED_SECRET=ci-bff-ci-bff-ci-bff-ci-bff-ci-bff-ci/; s/^EDGE_SHARED_SECRET=$/EDGE_SHARED_SECRET=ci-edge-ci-edge-ci-edge-ci-edge-ci-edge/' .env
          docker compose --env-file .env config -q
