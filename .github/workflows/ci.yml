name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Organisation API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: organisation
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: organisation
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U organisation" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL)
        env:
          ORG_TEST_DATABASE_URL: postgresql+psycopg://organisation:ci-only@localhost:5432/organisation
        run: python -m pytest -q
      - name: Migrations apply on PostgreSQL and match the models
        env:
          ORG_DATABASE_URL: postgresql+psycopg://organisation:ci-only@localhost:5432/organisation
          ORG_RECEIPTS_DIR: /tmp/receipts
        run: |
          python -c "from app import models; from app.db import Base, get_engine; Base.metadata.drop_all(get_engine())"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          ORG_ID=$(python -m app.cli create-org --name "CI Organisation" --tin 0012345678 | tail -n 1)
          printf '%s\n' 'a long ci passphrase' | python -m app.cli create-admin --org "$ORG_ID" --email ci@tena.example --name "CI Admin" --password-stdin
          python -m app.cli create-admin --org "$ORG_ID" --email link@tena.example --name "Link Admin" | grep -q '/setup#'
          python -m app.cli list-orgs
          python -m app.cli list-admins
      - name: Database roles (owner migrates; the app role cannot change the schema or the audit log)
        env:
          PGHOST: localhost
          PGPASSWORD: ci-only
          POSTGRES_USER: organisation
          POSTGRES_DB: organisation_roles
          ORG_OWNER_PASSWORD: owner-ci
          ORG_APP_PASSWORD: app-ci
        run: |
          psql -U organisation -d organisation -v ON_ERROR_STOP=1 -c "CREATE DATABASE organisation_roles"
          sh ../deploy/postgres-init/10-roles.sh
          ORG_DATABASE_URL=postgresql+psycopg://org_owner:owner-ci@localhost:5432/organisation_roles alembic upgrade head
          ORG_ROLES_APP_URL=postgresql+psycopg://org_app:app-ci@localhost:5432/organisation_roles python -m pytest -q tests/test_db_roles.py
          # Tables made by a later migration reach the app role too (default privileges).
          PGPASSWORD=owner-ci psql -U org_owner -d organisation_roles -v ON_ERROR_STOP=1 -c "CREATE TABLE later_table (id int)"
          PGPASSWORD=app-ci psql -U org_app -d organisation_roles -v ON_ERROR_STOP=1 -c "INSERT INTO later_table VALUES (1)"

  web:
    name: Web app (lint, types, build, browser tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: organisation-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: organisation-frontend/package-lock.json
      - run: npm ci
      # The browser tests run against the real organisation API.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install the organisation API
        run: pip install -r ../backend/requirements.txt
      - name: Lint
        run: npx eslint .
      - name: Build
        run: npx next build
      # After the build: it generates the route types the type check needs.
      - name: Type check
        run: npx tsc --noEmit
      # playwright.config.ts drives the `chrome` channel: the runner's installed
      # Google Chrome, so no browser is downloaded.
      - name: Browser tests
        env:
          E2E_PYTHON: python
        run: npx playwright test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            organisation-frontend/playwright-report
            organisation-frontend/test-results
          retention-days: 7

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t endod-organisation-api backend
      - run: docker build -t endod-organisation-web organisation-frontend
      - name: Compose file is valid
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/^SESSION_SECRET=$/SESSION_SECRET=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci/; s/^BFF_SHARED_SECRET=$/BFF_SHARED_SECRET=ci-bff-ci-bff-ci-bff-ci-bff-ci-bff-ci/' .env
          docker compose --env-file .env config -q
